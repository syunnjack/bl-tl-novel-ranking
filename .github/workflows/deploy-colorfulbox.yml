name: Deploy to ColorfulBOX

on:
  push:
    branches: [master]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          tools: composer
          extensions: sqlite3, pdo_sqlite

      - name: Install PHP dependencies
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend assets
        run: |
          npm ci
          npm run build

      - name: Deploy files via rsync over SSH
        uses: burnett01/rsync-deployments@7.0.1
        with:
          switches: -avzr --delete --exclude=".git" --exclude=".github" --exclude="node_modules" --exclude="tests" --exclude=".env" --exclude="database/database.sqlite" --exclude="storage/app" --exclude="storage/logs" --exclude="storage/framework"
          path: ./
          remote_path: ${{ secrets.COLORFULBOX_DEPLOY_PATH }}
          remote_host: ${{ secrets.COLORFULBOX_SSH_HOST }}
          remote_port: ${{ secrets.COLORFULBOX_SSH_PORT }}
          remote_user: ${{ secrets.COLORFULBOX_SSH_USER }}
          remote_key: ${{ secrets.COLORFULBOX_SSH_KEY }}

      - name: Run migrations, cache config, sync content
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.COLORFULBOX_SSH_HOST }}
          port: ${{ secrets.COLORFULBOX_SSH_PORT }}
          username: ${{ secrets.COLORFULBOX_SSH_USER }}
          key: ${{ secrets.COLORFULBOX_SSH_KEY }}
          script: |
            set -e
            cd "${{ secrets.COLORFULBOX_DEPLOY_PATH }}"
            PHP=/opt/cpanel/ea-php83/root/usr/bin/php
            mkdir -p database storage/framework/cache storage/framework/sessions storage/framework/views storage/logs storage/app
            touch database/database.sqlite
            chmod -R 775 storage database
            $PHP artisan migrate --force
            $PHP artisan config:cache
            $PHP artisan route:cache
            $PHP artisan view:cache
            /opt/cpanel/ea-php83/root/usr/bin/php artisan novels:sync
            (crontab -l 2>/dev/null | grep -F "novels:sync") || ( (crontab -l 2>/dev/null; echo "25 * * * * cd \"${{ secrets.COLORFULBOX_DEPLOY_PATH }}\" && /opt/cpanel/ea-php83/root/usr/bin/php artisan novels:sync >> storage/logs/sync.log 2>&1") | crontab - )
